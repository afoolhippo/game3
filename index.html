<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>がめ煮SOUL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- タイトル -->
<div id="titleScreen" class="screen">

  <img src="title.png" id="titleImage" alt="がめ煮SOUL">

  <div id="pressStart">
    PRESS START
  </div>

  <div id="guideText">
    鍋を左右に動かして具材をゲットせよ！<br>
    CDとVHSには注意！
  </div>

</div>

<!-- ゲーム -->
<div id="gameScreen" class="screen hidden">

  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>TIME <span id="time">107</span></div>
  </div>

  <canvas id="gameCanvas" width="430" height="760"></canvas>

</div>

<!-- RESULT -->
<div id="resultScreen" class="screen hidden">

  <div id="resultInner">

    <h1>がめ煮完成！</h1>

    <div id="resultText"></div>

    <button id="restartBtn">
      もう一回
    </button>

  </div>

</div>

<audio id="bgm" src="gameni_soul.mp3"></audio>

<audio id="seGood" src="get_good.mp3"></audio>
<audio id="seGold" src="get_gold.mp3"></audio>
<audio id="seCD" src="hit_cd.mp3"></audio>
<audio id="seVHS" src="hit_vhs.mp3"></audio>
<audio id="seStart" src="start.mp3"></audio>
<audio id="seResult" src="result.mp3"></audio>
<audio id="seChorus" src="chorus_start.mp3"></audio>

<script src="game.js"></script>

</body>
</html>
